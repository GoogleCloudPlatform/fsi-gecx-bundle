name: 80f02b21-5b77-4907-94a3-bd67534bff66
displayName: Credit Card Support Agent
description: Handles credit-card support work and delegates only confirmed consultation closeout.
modelSettings:
  model: gemini-3.1-flash-live
instruction: agents/Credit_Card_Support_Agent/instruction.txt
childAgents:
- Session Closeout Agent
transferRules:
- childAgent: Session Closeout Agent
  direction: CHILD_TO_PARENT
  disablePlannerTransfer:
    expressionCondition:
      expression: closeout_delegation_authorized == true
beforeToolCallbacks:
- pythonCode: agents/Credit_Card_Support_Agent/before_tool_callbacks/enforce_closeout.py
  description: Keep consultation closeout checkpoints outside proposal authorization.
- pythonCode: agents/Credit_Card_Support_Agent/before_tool_callbacks/enforce_proposal_context.py
  description: Bind typed proposal tool choices to callback-owned ordered turn evidence.
afterToolCallbacks:
- pythonCode: agents/Credit_Card_Support_Agent/after_tool_callbacks/capture_proposal.py
  description: Capture active-alert identifiers plus the opaque proposal and banking-authored summary.
afterModelCallbacks:
- pythonCode: agents/Credit_Card_Support_Agent/after_model_callbacks/ensure_closeout_offer.py
  description: Append a required closeout offer without replacing native model audio.
toolsets:
- toolset: banking_service_mcp_toolset
  toolIds:
  - get_open_fraud_alert
  - review_fraud_selection
  - propose_fraud_triage
  - commit_fraud_triage
  - propose_card_reissue
  - commit_card_reissue
  - propose_wallet_provisioning
  - commit_wallet_provisioning
  - decide_action_proposal
  - offer_session_closeout
  - request_credit_limit_increase
  - reverse_overdraft_fee
