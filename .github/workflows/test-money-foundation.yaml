name: Test Money Foundation

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  money-contract:
    runs-on: ubuntu-latest
    env:
      TEST_MONEY_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fsi_money_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fsi_money_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: banking-service/uv.lock
      - run: uv python install 3.13
      - run: ./scripts/test_money_foundation.sh

  money-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: banking-ui/package-lock.json
      - run: npm ci
        working-directory: banking-ui
      - run: npm test && npm run build
        working-directory: banking-ui

  money-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          mvn --batch-mode -q -f deployment/dataflow-audit-iceberg/pom.xml test

  money-voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: adk-agent/credit-support-agent/uv.lock
      - run: uv python install 3.13
      - run: uv run --project adk-agent/credit-support-agent --frozen pytest -q adk-agent/credit-support-agent/tests
