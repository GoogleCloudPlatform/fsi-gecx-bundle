# Build the selected Money qualification components; no deploy or database reset.
steps:
  - name: python:3.13-slim
    id: metadata
    entrypoint: python
    args:
      - -c
      - |
        import pathlib, re, time
        for name in ['banking-service/utils/version.py', 'adk-agent/credit-support-agent/agent/version.py']:
            p = pathlib.Path(name)
            text = re.sub(r'BUILD_COMMIT_ID = ".*"', 'BUILD_COMMIT_ID = "${_RELEASE_COMMIT}"', p.read_text())
            text = re.sub(r'BUILD_TIME = ".*"', f'BUILD_TIME = "{int(time.time()*1000)}"', text)
            p.write_text(text)
  - name: gcr.io/cloud-builders/docker
    id: banking
    waitFor: [metadata]
    args: [build, -t, '${_REGION}-docker.pkg.dev/$PROJECT_ID/fsi-gecx-bundle/banking-service:${_RELEASE_COMMIT}', banking-service]
  - name: gcr.io/cloud-builders/docker
    id: ui
    waitFor: [metadata]
    args: [build, -t, '${_REGION}-docker.pkg.dev/$PROJECT_ID/fsi-gecx-bundle/banking-ui:${_RELEASE_COMMIT}', banking-ui]
  - name: gcr.io/cloud-builders/docker
    id: voice
    waitFor: [metadata]
    args: [build, -f, adk-agent/credit-support-agent/Dockerfile, -t, '${_REGION}-docker.pkg.dev/$PROJECT_ID/fsi-gecx-bundle/credit-support-agent:${_RELEASE_COMMIT}', .]
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/fsi-gecx-bundle/banking-service:${_RELEASE_COMMIT}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/fsi-gecx-bundle/banking-ui:${_RELEASE_COMMIT}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/fsi-gecx-bundle/credit-support-agent:${_RELEASE_COMMIT}'
substitutions:
  _REGION: us-central1
  _RELEASE_COMMIT: local
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: 1800s
